<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="description" content="알뜰폰 회사의 리퍼폰 + 요금제 순환 구독을 가정한 시제품. 가상 데이터.">
  <title>폰 순환 구독 데스크</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <p class="brand">폰 순환 구독 데스크 <span class="tag">시제품</span></p>
      <div class="roles" role="group" aria-label="화면 바꾸기">
        <button type="button" data-role="customer" aria-pressed="true">손님</button>
        <button type="button" data-role="ops" aria-pressed="false">담당자</button>
      </div>
    </div>
  </header>
  <main class="wrap">
    <div id="view-customer"></div>
    <div id="view-ops" hidden></div>
  </main>
  <footer class="foot">
    <p data-demo-note>가상 데이터 시연입니다. 실제 회사 · 고객 · 가격이 아닙니다.</p>
  </footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
